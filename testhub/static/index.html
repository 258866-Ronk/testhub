<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>TestHub 控制台</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f4f7f5;color:#1f2937}
header{background:#1b4d3e;color:#fff;padding:18px 28px}header h1{margin:0;font-size:20px}
header p{margin:4px 0 0;color:#bfe0cf;font-size:13px}
.wrap{max-width:960px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e3eae5;border-radius:12px;padding:20px;margin-bottom:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{padding:9px 12px;border:1px solid #d1d9d3;border-radius:8px;font-size:14px}
button{background:#1b4d3e;color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-size:14px}
button.alt{background:#b7791f}button:disabled{opacity:.5}
code{background:#eef4f0;padding:2px 6px;border-radius:5px}
pre{background:#0f2a22;color:#cfe8d8;padding:14px;border-radius:8px;overflow:auto;font-size:12px;min-height:60px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{border-bottom:1px solid #eef1ee;padding:8px;text-align:left}
.badge{padding:2px 8px;border-radius:20px;font-size:12px}
.pass{background:#dff3e7;color:#166534}.fail{background:#fee2e2;color:#991b1b}
.pend{background:#fef3c7;color:#92400e}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px;margin-top:8px}
</style></head><body>
<header><h1>TestHub · 自动化测试管理平台</h1><p>个人项目 · 从0到1搭建 · Python + Flask + SQLite</p></header>
<div class="wrap">
 <div class="card"><h3>1. 登录</h3>
  <div class="row"><input id="u" value="op" placeholder="用户名"><input id="p" value="123456" placeholder="密码">
  <button onclick="login()">登录</button><span id="who">未登录</span></div>
 </div>
 <div class="card"><h3>2. 触发一次评测运行</h3>
  <div class="row"><select id="mode"><option>sequential</option><option>parallel</option></select>
  <input id="idem" placeholder="幂等键(可留空)"><button onclick="runIt()">立即执行</button></div>
  <p id="runmsg" style="color:#6b7280;font-size:13px"></p>
 </div>
 <div class="card"><h3>3. 运行状态 / CI 门禁 / 性能</h3>
  <div class="row"><input id="runno" placeholder="RUN-..."><button onclick="check()">查询</button></div>
  <div class="kv" id="detail"></div>
  <div id="gate"></div>
 </div>
 <div class="card"><h3>响应</h3><pre id="out">点击上方按钮查看响应</pre></div>
</div>
<script>
let TOKEN='';
async function api(path,opt={}){opt.headers=opt.headers||{};if(TOKEN)opt.headers.Authorization='Bearer '+TOKEN;
 opt.headers['Content-Type']='application/json';const r=await fetch(path,opt);return await r.json();}
async function login(){const d=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});
 if(d.code===0){TOKEN=d.data.token;who.textContent='已登录: '+d.data.username+' ('+d.data.role+')';
  who.style.color='#166534';out.textContent=JSON.stringify(d,null,2);}else out.textContent=JSON.stringify(d,null,2);}
async function runIt(){const body={mode:mode.value,idempotencyKey:idem.value||undefined};
 const d=await api('/api/v1/runs',{method:'POST',body:JSON.stringify(body)});out.textContent=JSON.stringify(d,null,2);
 if(d.code===0){runno.value=d.data.run_no;runmsg.textContent='已创建 '+d.data.run_no+'（'+d.data.status+'），worker 正在执行…';
  setTimeout(check,1500);setTimeout(check,3500);}}
async function check(){if(!runno.value){out.textContent='请先填写 runNo';return;}
 const r=await api('/api/v1/runs/'+runno.value);const g=await api('/api/v1/runs/'+runno.value+'/gate');
 const s=await api('/api/v1/stats/'+runno.value);out.textContent=JSON.stringify({run:r,gate:g,stats:s},null,2);
 const d=r.data||{};detail.innerHTML='<span>runNo</span><code>'+d.run_no+'</code>'+
  '<span>状态</span><span>'+d.status+'</span><span>用例</span><span>'+d.total+'</span>'+
  '<span>通过/失败</span><span>'+d.passed+' / '+d.failed+'</span><span>耗时</span><span>'+d.duration_ms+' ms</span>'+
  '<span>P95/P99</span><span>'+((s.data||{}).p95)+' / '+((s.data||{}).p99)+' ms</span>';
 const allowed=(g.data||{}).allowed;gate.innerHTML='<span class="badge '+(allowed?'pass':'fail')+'">'+
  (allowed?'CI 门禁：放行':'CI 门禁：拦截')+'</span>';}
</script></body></html>
